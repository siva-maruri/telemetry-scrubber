[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "telemetry-scrubber"
version = "0.1.0"
description = "PII and secret scrubbing for OpenTelemetry spans and logs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Siva Maruri" }]
dependencies = []

[project.optional-dependencies]
otel = ["opentelemetry-sdk>=1.20"]
azure = ["azure-identity>=1.15", "azure-keyvault-secrets>=4.7"]
dev = ["pytest>=7", "ruff>=0.4", "opentelemetry-sdk>=1.20"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
